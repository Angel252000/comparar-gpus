<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comparador de GPUs</title>
<meta name="description" content="Pon dos tarjetas graficas lado a lado: FPS, VRAM, consumo, precio y FPS por cada $100.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="half a" id="ha"><span class="ghost" id="ga"></span></div>
<div class="half b" id="hb"><span class="ghost" id="gb"></span></div>

<main>
  <div class="pick a"><select id="s1" aria-label="GPU 1"></select></div>
  <div class="pick b"><select id="s2" aria-label="GPU 2"></select></div>

  <section class="card" id="card" aria-live="polite">
    <h1>Comparar GPUs</h1>
    <table id="t"><thead><tr><th></th><th id="h1"></th><th id="h2"></th></tr></thead><tbody></tbody></table>
    <p id="g" class="wins"></p>
    <p id="msg" role="status"></p>
  </section>

  <form id="f" class="bar">
    <input id="q" placeholder='Escribe: "RTX 5070 vs RX 9070 XT"' autocomplete="off" aria-label="Comparar en lenguaje natural">
    <button>Comparar</button>
  </form>
  <p class="nota">Datos aproximados con fines didacticos</p>
</main>
<script src="app.js"></script>
</body>
</html>
